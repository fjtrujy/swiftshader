# Build the patched SwiftShader Vulkan ICD and publish it as a release asset.
#
# Why this exists: zoi's CI and its local golden recorder used to take
# libvk_swiftshader out of a Chrome for Testing bundle. That ships the stock
# driver, which has a heap-use-after-free on render-target VkImageViews
# (see the commit on this branch). This workflow builds the patched driver
# instead, for the two platforms zoi needs:
#
#   linux-x64   GitHub-hosted ubuntu runners -> the `visual` / `gpu` CI lanes
#   mac-arm64   maintainer laptops           -> scripts/visual/record-swiftshader-goldens.sh
#
# Tag a commit `zoi-v<n>` to cut a release; `workflow_dispatch` builds without
# publishing so the build itself can be checked first.
name: zoi release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'zoi-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: swiftshader-linux-x64
            out_dir: Linux
            lib: libvk_swiftshader.so
          - runner: macos-14
            asset: swiftshader-mac-arm64
            out_dir: Darwin
            lib: libvk_swiftshader.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Only the submodules vk_swiftshader actually needs. `--recursive` would
      # also drag in PowerVR_Examples, which is large and unused here.
      - name: Fetch required submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/marl third_party/SPIRV-Tools third_party/SPIRV-Headers

      - name: Install ninja
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build
          else brew install ninja; fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSWIFTSHADER_BUILD_TESTS=FALSE \
            -DSWIFTSHADER_BUILD_PVR=FALSE \
            -DSWIFTSHADER_BUILD_BENCHMARKS=FALSE

      - name: Build
        run: cmake --build build --target vk_swiftshader

      # The ICD json names the library by a RELATIVE path, so the two files must
      # stay side by side in the extracted directory.
      - name: Package
        run: |
          set -euo pipefail
          src="build/${{ matrix.out_dir }}"
          test -r "${src}/${{ matrix.lib }}"
          test -r "${src}/vk_swiftshader_icd.json"
          mkdir -p "pkg/${{ matrix.asset }}"
          cp "${src}/${{ matrix.lib }}" "${src}/vk_swiftshader_icd.json" "pkg/${{ matrix.asset }}/"
          tar -C pkg -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if [ "${RUNNER_OS}" = "Linux" ]; then sha256sum "${{ matrix.asset }}.tar.gz"
          else shasum -a 256 "${{ matrix.asset }}.tar.gz"; fi | tee "${{ matrix.asset }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/zoi-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes \
            "Patched SwiftShader Vulkan ICD for zoi. Base: $(git rev-parse --short HEAD)." \
            || true
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}.tar.gz.sha256" --clobber
