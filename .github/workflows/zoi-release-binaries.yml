# Build the patched SwiftShader Vulkan ICD and publish it as a release.
#
# Why this exists: zoi's CI and its local golden recorder used to take
# libvk_swiftshader out of a Chrome for Testing bundle. That ships the stock
# driver, which has a heap-use-after-free on render-target VkImageViews
# (see the fix commit on this branch). This builds the patched driver instead,
# for the two platforms zoi needs:
#
#   linux-x64   GitHub-hosted ubuntu runners -> the `visual` / `gpu` CI lanes
#   mac-arm64   maintainer laptops           -> scripts/visual/record-swiftshader-goldens.sh
#
# VERSIONING. Every commit on a `zoi/**` branch publishes its own release,
# tagged `zoi-v<ZOI_VERSION>-<short sha>` (e.g. zoi-v1.0.0-5b10bed7f). The tag
# is therefore immutable: a given tag always names one commit and one pair of
# binaries, which is what zoi pins. Bump the `ZOI_VERSION` file for a release
# that is meant to be read as a new version rather than a new build of one.
# Asset NAMES stay constant across versions so the download URL is
# `.../releases/download/<tag>/swiftshader-<platform>.tar.gz`.
name: zoi release binaries

on:
  workflow_dispatch:
  push:
    branches:
      - 'zoi/**'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: swiftshader-linux-x64
            out_dir: Linux
            lib: libvk_swiftshader.so
          - runner: macos-14
            asset: swiftshader-mac-arm64
            out_dir: Darwin
            lib: libvk_swiftshader.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Only the submodules vk_swiftshader actually needs. `--recursive` would
      # also drag in PowerVR_Examples, which is large and unused here.
      - name: Fetch required submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/marl third_party/SPIRV-Tools third_party/SPIRV-Headers

      - name: Install ninja
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build
          else brew install ninja; fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSWIFTSHADER_BUILD_TESTS=FALSE \
            -DSWIFTSHADER_BUILD_PVR=FALSE \
            -DSWIFTSHADER_BUILD_BENCHMARKS=FALSE

      - name: Build
        run: cmake --build build --target vk_swiftshader

      # The ICD json names the library by a RELATIVE path, so the two files must
      # stay side by side in the extracted directory.
      # The ELF .so carries its DWARF inline, which made the first published
      # linux-x64 tarball 427 MB against mac-arm64's 12 MB (a Mach-O dylib keeps
      # debug info in the .o files, which are not shipped). zoi's CI downloads
      # this on every job, so the DWARF is split into a separate asset that is
      # only fetched when something needs symbolising. `--strip-debug` keeps the
      # symbol table, so a crash backtrace still names functions without it.
      - name: Package
        run: |
          set -euo pipefail
          src="build/${{ matrix.out_dir }}"
          lib="${{ matrix.lib }}"
          asset="${{ matrix.asset }}"
          test -r "${src}/${lib}"
          test -r "${src}/vk_swiftshader_icd.json"
          mkdir -p "pkg/${asset}"
          cp "${src}/vk_swiftshader_icd.json" "pkg/${asset}/"

          if [ "${RUNNER_OS}" = "Linux" ]; then
            objcopy --only-keep-debug "${src}/${lib}" "${lib}.debug"
            objcopy --strip-debug "${src}/${lib}" "pkg/${asset}/${lib}"
            objcopy --add-gnu-debuglink="${lib}.debug" "pkg/${asset}/${lib}"
            tar -czf "${asset}-debug.tar.gz" "${lib}.debug"
          else
            cp "${src}/${lib}" "pkg/${asset}/"
          fi

          tar -C pkg -czf "${asset}.tar.gz" "${asset}"

          sha() {
            if [ "${RUNNER_OS}" = "Linux" ]; then sha256sum "$1"; else shasum -a 256 "$1"; fi \
              | tee "$1.sha256"
          }
          sha "${asset}.tar.gz"
          if [ -r "${asset}-debug.tar.gz" ]; then sha "${asset}-debug.tar.gz"; fi
          ls -l "${asset}".*tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
            ${{ matrix.asset }}-debug.tar.gz
            ${{ matrix.asset }}-debug.tar.gz.sha256
          if-no-files-found: ignore

  # One job creates the release, so the two build jobs cannot race each other
  # into a half-populated one. It runs only if BOTH platforms built: a release
  # carrying one of the two would be pinnable by zoi and then fail on the other
  # platform.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ZOI_VERSION)"
          test -n "${version}"
          tag="zoi-v${version}-$(git rev-parse --short=9 HEAD)"

          test -r "dist/swiftshader-linux-x64.tar.gz"
          test -r "dist/swiftshader-mac-arm64.tar.gz"

          # Re-running a workflow on the same commit must not try to recreate
          # the tag; uploading with --clobber keeps that case idempotent.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            printf '%s\n' \
              'Patched SwiftShader Vulkan ICD for zoi.' \
              '' \
              "Version: ${version}" \
              "Branch: ${GITHUB_REF_NAME}" \
              "Commit: ${GITHUB_SHA}" \
              '' \
              'Pin this tag from zoi; asset names are stable across versions.' > notes.md
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --notes-file notes.md
          fi

          gh release upload "${tag}" dist/* --clobber
          echo "published ${tag}" >> "${GITHUB_STEP_SUMMARY}"
